plugins {
    id "com.android.application"
}

android {
    namespace "com.godwise.remote"
    compileSdk 34

    defaultConfig {
        applicationId "com.godwise.remote"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        def ghToken = (System.getenv("GH_TOKEN") ?: "").replace("\\", "\\\\").replace("\"", "\\\"")
        buildConfigField "String", "GH_TOKEN", "\"${ghToken}\""
        buildConfigField "String", "GH_REPO", "\"r8e8cd8/godwise-debug\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress += ["task", "tflite"]
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.camera:camera-core:1.3.4"
    implementation "androidx.camera:camera-camera2:1.3.4"
    implementation "androidx.camera:camera-lifecycle:1.3.4"
    implementation "androidx.camera:camera-view:1.3.4"
    implementation "androidx.camera:camera-video:1.3.4"
    implementation "com.google.mediapipe:tasks-vision:0.10.29"
    implementation "org.tensorflow:tensorflow-lite:2.14.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
}

configurations.configureEach {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24"
    }
}
